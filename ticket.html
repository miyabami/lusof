<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ticket de Compra</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .ticket-container {
      background: white;
      padding: 2rem 3rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 10px;
      width: 320px;
    }

    .ticket h2 {
      text-align: center;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .ticket-id, #fecha {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    hr {
      border: none;
      border-top: 1px dashed #999;
      margin: 1rem 0;
    }

    .ticket-items {
      list-style: none;
      padding: 0;
      margin: 0 0 1rem 0;
    }

    .ticket-items li {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dotted #ccc;
      padding: 0.2rem 0;
      font-size: 1rem;
    }

    .total {
      font-weight: bold;
      font-size: 1.2rem;
      text-align: right;
    }

    .gracias {
      margin-top: 1.5rem;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      color: #f06292;
    }

    .btn-regresar {
      display: block;
      text-align: center;
      margin-top: 1rem;
      text-decoration: none;
      color: #007BFF;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="ticket-container">
    <div class="ticket">
      <h2>TICKET DE COMPRA</h2>
      <p class="ticket-id">Núm. Orden: <span id="order-id"></span></p>
      <p>Fecha: <span id="fecha"></span></p>
      <hr />
      <ul id="ticket-items" class="ticket-items"></ul>
      <hr />
      <p class="total">Total: $<span id="total-ticket">0.00</span></p>
      <p class="gracias">¡Gracias por su compra!</p>
      <a href="index.html" class="btn-regresar">← Volver a tienda</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let carrito = [];
      let total = 0;

      try {
        // Recuperar el carrito desde localStorage
        const carritoJSON = localStorage.getItem('carrito');
        if (carritoJSON) {
          carrito = JSON.parse(carritoJSON);
        }

        // Verificar que el carrito tiene productos válidos
        if (carrito && Array.isArray(carrito)) {
          total = carrito.reduce((sum, item) => {
            if (item.precio && !isNaN(item.precio)) {
              return sum + item.precio;
            }
            return sum;
          }, 0);
        }
      } catch (e) {
        console.error('Error leyendo localStorage:', e);
      }

      const ticketList = document.getElementById('ticket-items');
      const totalSpan = document.getElementById('total-ticket');
      const orderId = document.getElementById('order-id');
      const fecha = document.getElementById('fecha');

      const date = new Date();
      fecha.textContent = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();

      // Generar un número de orden aleatorio
      orderId.textContent = String(Math.floor(100000 + Math.random() * 900000));

      // Mostrar productos
      if (carrito.length === 0) {
        const li = document.createElement('li');
        li.textContent = "No hay productos comprados.";
        ticketList.appendChild(li);
      } else {
        carrito.forEach(item => {
          const li = document.createElement('li');
          li.textContent = `${item.nombre} - $${item.precio.toFixed(2)}`;
          ticketList.appendChild(li);
        });
      }

      // Mostrar total
      totalSpan.textContent = total.toFixed(2);
    });
  </script>
</body>
</html>
