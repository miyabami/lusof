<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ticket de Compra</title>
  <link rel="stylesheet" href="ticket.css" />
</head>
  <style>
  body {
  font-family: 'Courier New', Courier, monospace;
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.ticket-container {
  background: white;
  padding: 2rem 3rem;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  border-radius: 10px;
  width: 320px;
}

.ticket h2 {
  text-align: center;
  margin-bottom: 0.5rem;
  font-weight: bold;
  font-family: 'Courier New', Courier, monospace;
}

.ticket-id, #fecha {
  font-size: 0.9rem;
  color: #555;
  margin-bottom: 0.5rem;
  text-align: center;
}

hr {
  border: none;
  border-top: 1px dashed #999;
  margin: 1rem 0;
}

.ticket-items {
  list-style: none;
  padding: 0;
  margin: 0 0 1rem 0;
}

.ticket-items li {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px dotted #ccc;
  padding: 0.2rem 0;
  font-size: 1rem;
}

.total {
  font-weight: bold;
  font-size: 1.2rem;
  text-align: right;
}

.gracias {
  margin-top: 1.5rem;
  text-align: center;
  font-weight: bold;
  font-size: 1.1rem;
  color: #f06292;
}
    </style>

<body>
  <div class="ticket-container">
    <div class="ticket">
      <h2>TICKET DE COMPRA</h2>
      <p class="ticket-id">Núm. Orden: #<span id="order-id"></span></p>
      <p>Fecha: <span id="fecha"></span></p>
      <hr />
      <ul id="ticket-items" class="ticket-items"></ul>
      <hr />
      <p class="total">Total: $<span id="total-ticket">0.00</span></p>
      <p class="gracias">¡Gracias por su compra!</p>
      <a href="index.html" class="btn-regresar">← Volver a tienda</a>
    </div>
  </div>

  <script src="pipshas.js"></script>
</body>
</html>
